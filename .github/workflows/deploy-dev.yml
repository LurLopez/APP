name: Deploy Development

on:
  push:
    branches: [development]
  pull_request:
    branches: [development]
  workflow_dispatch:

concurrency:
  group: deploy-development
  cancel-in-progress: false

jobs:
  check:
    name: Comprobación de sintaxis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: node --check
        run: |
          status=0
          while IFS= read -r f; do
            node --check "$f" || status=1
          done < <(git ls-files '*.js')
          exit $status

  deploy:
    name: Desplegar en dev.cifraresearch.com
    needs: check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Comprobar secretos de despliegue
        id: secrets
        env:
          HOST: ${{ secrets.VPS_HOST }}
        run: |
          if [ -z "$HOST" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Secretos sin configurar: se omite el despliegue."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Desplegar por SSH
        if: steps.secrets.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /var/www/cifra-dev
            git fetch origin development
            git checkout -B development origin/development
            git reset --hard origin/development
            npm ci --no-audit --no-fund
            npm run db:migrate
            sudo fuser -k "3001/tcp" >/dev/null 2>&1 || true
            sleep 1
            sudo systemctl restart cifra-dev
            for i in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:3001/robots.txt >/dev/null 2>&1; then
                echo "Despliegue de development completado (servicio listo tras ${i} intento(s))"
                exit 0
              fi
              sleep 2
            done
            echo "El servicio cifra-dev no respondió en 60 s; últimas líneas del log:"
            sudo journalctl -u cifra-dev -n 40 --no-pager || true
            exit 1
