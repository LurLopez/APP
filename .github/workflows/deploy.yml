name: CI/CD

on:
  push:
    branches: [development, main]
  pull_request:
    branches: [development, main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Comprobación de sintaxis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: node --check
        run: |
          status=0
          while IFS= read -r f; do
            node --check "$f" || status=1
          done < <(git ls-files '*.js')
          exit $status

  deploy:
    name: Desplegar ${{ github.ref_name }}
    needs: check
    if: github.event_name == 'push' && (github.ref == 'refs/heads/development' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - name: Comprobar secretos de despliegue
        id: secrets
        env:
          HOST: ${{ secrets.VPS_HOST }}
        run: |
          if [ -z "$HOST" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Secretos sin configurar: se omite el despliegue."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Desplegar por SSH
        if: steps.secrets.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          script: |
            set -e
            if [ "${{ github.ref_name }}" = "main" ]; then
              DIR=/var/www/cifra-prod
              BRANCH=main
              SERVICE=cifra-prod
              PORT=3000
              NPM_FLAGS="--omit=dev"
            else
              DIR=/var/www/cifra-dev
              BRANCH=development
              SERVICE=cifra-dev
              PORT=3001
              NPM_FLAGS=""
            fi
            cd "$DIR"
            git fetch origin "$BRANCH"
            git reset --hard "origin/$BRANCH"
            npm ci $NPM_FLAGS --no-audit --no-fund
            npm run db:migrate
            sudo systemctl restart "$SERVICE"
            sleep 3
            curl -fsS "http://127.0.0.1:$PORT/robots.txt" > /dev/null
            echo "Despliegue de $BRANCH completado en $DIR"
